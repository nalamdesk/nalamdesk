name: Pages CI

# Validates the docs site on PRs (Docusaurus). On master, deploy-docs.yml
# builds the same site before deploying it to Cloudflare, so no push run
# here. Landing has its own pipeline in deploy-landing.yml (build +
# wrangler dry-run on PR, deploy on master).
on:
  pull_request:
    branches:
      - master
    paths:
      - 'cloud/documentation/**'
      - '.github/workflows/pages-ci.yml'

jobs:
  # Picks the runner for the jobs below: GitHub-hosted while the account
  # has Actions minutes left, otherwise CI_RUNNER (see feature-ci.yml).
  # Out of minutes, this job fails within seconds without running;
  # continue-on-error keeps that from failing the run.
  runner:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 2
    outputs:
      hosted: ${{ steps.probe.outputs.hosted }}
    steps:
      - id: probe
        run: echo "hosted=true" >> "$GITHUB_OUTPUT"

  docs:
    needs: runner
    if: ${{ !cancelled() }}
    name: Docs build (Docusaurus)
    runs-on: ${{ needs.runner.outputs.hosted == 'true' && 'ubuntu-latest' || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ./cloud/documentation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # CI_RUNNER: self-hosted runners keep ~/.npm, so skip the GitHub cache (see feature-ci.yml).
          cache: ${{ needs.runner.outputs.hosted == 'true' && 'npm' || '' }}
          cache-dependency-path: cloud/documentation/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build
