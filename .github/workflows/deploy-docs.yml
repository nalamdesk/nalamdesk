name: Deploy Documentation

# Docs site (Docusaurus static build) to Cloudflare Workers Static Assets
# (worker `nalamdesk-docs`, custom domain docs.nalamdesk.com).
# GitHub Pages cannot serve this private repo on the current plan
# (API returns 422), so the old peaceiris gh-pages step is retired.
on:
  push:
    branches:
      - master
    paths:
      - 'cloud/documentation/**'
      - '.github/workflows/deploy-docs.yml'

jobs:
  deploy:
    name: Build and deploy docs
    # CI_RUNNER: see feature-ci.yml.
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    concurrency:
      group: "deploy-docs-${{ github.ref }}"
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ./cloud/documentation
    env:
      CF_SEND_TELEMETRY: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # CI_RUNNER: self-hosted runners keep ~/.npm, so skip the GitHub cache (see feature-ci.yml).
          cache: ${{ !vars.CI_RUNNER && 'npm' || '' }}
          cache-dependency-path: cloud/documentation/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Website
        run: npm run build

      - name: Validate Worker config (no credentials)
        run: npx wrangler deploy --dry-run

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
