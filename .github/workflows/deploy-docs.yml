name: Deploy Documentation

on:
  push:
    branches:
      - master
    paths:
      - 'cloud/documentation/**'

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    concurrency:
      group: "deploy-pages-${{ github.ref }}"
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: cloud/documentation/package-lock.json

      - name: Install Dependencies
        working-directory: cloud/documentation
        run: npm ci

      - name: Build Website
        working-directory: cloud/documentation
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cloud/documentation/build
