name: One-off relay 403 check

# Temporary, read-only: looks at why the sandbox bridge answers 403. Removed after it runs.
on:
  push:
    branches:
      - claude/project-thread-4rlgms
    paths:
      - '.github/workflows/oneoff-relay-check.yml'

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: sandbox
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Inspect
        run: |
          acct=$(aws sts get-caller-identity --query Account --output text)
          c=$(aws sts assume-role --role-arn arn:aws:iam::$acct:role/cdk-hnb659fds-lookup-role-$acct-ap-south-1 --role-session-name relaycheck --query Credentials --output json)
          export AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<<"$c") AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<<"$c") AWS_SESSION_TOKEN=$(jq -r .SessionToken <<<"$c")
          set -x
          aws cloudformation describe-stacks --stack-name NalamdeskRelay-sandbox --query 'Stacks[0].Outputs[].[OutputKey,OutputValue]' --output text || true
          ep=$(aws cloudformation describe-stacks --stack-name NalamdeskRelay-sandbox --query "Stacks[0].Outputs[?OutputKey=='EndpointDomain'].OutputValue" --output text)
          dist=$(aws cloudformation describe-stacks --stack-name NalamdeskRelay-sandbox --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          aws cloudformation describe-stack-resources --stack-name NalamdeskRelay-sandbox --query 'StackResources[].[LogicalResourceId,ResourceType,PhysicalResourceId,ResourceStatus]' --output text || true
          echo "== Direct, unsigned"; curl -sS -i --max-time 15 "https://$ep/health" | head -20 || true
          echo "== Via CloudFront"; curl -sS -i --max-time 15 "https://abdm-sandbox.cloud.nalamdesk.com/health" | head -25 || true
          aws cloudfront get-distribution-config --id "$dist" --query 'DistributionConfig.Origins.Items[].{d:DomainName,oac:OriginAccessControlId,headers:CustomHeaders}' --output json || true
          oac=$(aws cloudfront get-distribution-config --id "$dist" --query 'DistributionConfig.Origins.Items[0].OriginAccessControlId' --output text)
          aws cloudfront get-origin-access-control --id "$oac" --query 'OriginAccessControl.OriginAccessControlConfig' --output json || true
          aws lambda help 2>/dev/null | grep -i -E 'web-function|resource-policy' | head -20 || true
          for g in $(aws logs describe-log-groups --log-group-name-prefix /aws/lambda --query 'logGroups[?contains(logGroupName, `relay`) || contains(logGroupName, `sandbox`)].logGroupName' --output text) $(aws logs describe-log-groups --query 'logGroups[?contains(logGroupName, `nalamdesk`)].logGroupName' --output text); do
            echo "== log group $g"; aws logs filter-log-events --log-group-name "$g" --start-time $(( ($(date +%s) - 7200) * 1000 )) --limit 30 --query 'events[].message' --output text | tail -30 || true
          done
