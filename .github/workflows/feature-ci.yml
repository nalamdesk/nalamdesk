name: Feature Branch CI

# PRs targeting master still run Feature CI. Also run on push to master so
# every merge builds and checks the Electron packages. Restricting push to master avoids
# duplicate runs on feature-branch commits (those already fire via pull_request).
# Automated Release stays workflow_dispatch-only and is not used here.
#
# Cost control (private-repo minutes; macOS x10, Windows x2):
# - PRs run ubuntu-only (tests + web build + tsc). Full 3-OS matrix + Electron
#   packaging run on master pushes only; packaging breakage is release-time.
# - Stacked PR pushes cancel superseded runs (master pushes never cancel:
#   each merge must validate fully).
# - Doc/config-only PRs skip CI entirely via paths-ignore.
# - Every workflow starts with a `runner` job on a GitHub-hosted runner.
#   If it runs, the account still has Actions minutes and the Linux jobs
#   stay GitHub-hosted. If it fails to start (minutes used up), the jobs
#   move to the repo variable CI_RUNNER (a JSON runs-on value, for example
#   ["self-hosted","nalamdesk-laptop"]) and master pushes build Linux only.
#   On CI_RUNNER, setup-node skips the GitHub npm cache: self-hosted
#   runners keep ~/.npm on disk, and the cache upload/restore over the
#   runner's home connection cost more than the install it saved.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'landing/**'
      - 'cloud/documentation/**'
      - '.github/openreview.yml'

# Stacked pushes cancel dead runs; master merges always run to completion.
concurrency:
  group: feature-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Picks the runner for the jobs below: GitHub-hosted while the account
  # has Actions minutes left, otherwise CI_RUNNER (see feature-ci.yml).
  # Out of minutes, this job fails within seconds without running;
  # continue-on-error keeps that from failing the run.
  runner:
    # Shows as failed on a PR while the account is out of minutes; expected.
    name: GitHub-hosted minutes
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 2
    outputs:
      hosted: ${{ steps.probe.outputs.hosted }}
    steps:
      - id: probe
        run: echo "hosted=true" >> "$GITHUB_OUTPUT"

  # ABDM relay (cloud/relay): typecheck, tests and stack synth, ubuntu only.
  relay-check:
    needs: runner
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ${{ needs.runner.outputs.hosted == 'true' && 'ubuntu-latest' || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ./cloud/relay
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ needs.runner.outputs.hosted == 'true' && 'npm' || '' }}
          cache-dependency-path: cloud/relay/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Synth Relay stack
        run: npm run synth -- -c zoneName=example.in
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'

  # Code shared by the relay and booking API (cloud/shared): signed requests.
  shared-check:
    needs: runner
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ${{ needs.runner.outputs.hosted == 'true' && 'ubuntu-latest' || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ./cloud/shared
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ needs.runner.outputs.hosted == 'true' && 'npm' || '' }}
          cache-dependency-path: cloud/shared/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

  # Core CDK stacks (cloud/core): typecheck, assertions, synth.
  core-check:
    needs: runner
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ${{ needs.runner.outputs.hosted == 'true' && 'ubuntu-latest' || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ./cloud/core
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ needs.runner.outputs.hosted == 'true' && 'npm' || '' }}
          cache-dependency-path: cloud/core/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Synth Core stacks
        run: npm run synth -- -c zoneName=example.in -c budgetEmail=ops@example.in
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'

  build-check:
    needs: runner
    if: ${{ !cancelled() }}
    # matrix.os stays the logical OS name; the step conditions below use it.
    runs-on: ${{ matrix.os != 'ubuntu-latest' && matrix.os || needs.runner.outputs.hosted == 'true' && 'ubuntu-latest' || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ./desktop
    strategy:
      matrix:
        # Full matrix on master pushes; ubuntu-only on PRs and while the
        # account is out of Actions minutes.
        os: ${{ github.event_name == 'push' && needs.runner.outputs.hosted == 'true' && fromJSON('["windows-latest", "ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ needs.runner.outputs.hosted == 'true' && 'npm' || '' }}
          cache-dependency-path: desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Angular
        env:
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Run Unit Tests
        run: npm test -- --run


      # Build Electron (no publish). Linux clinic artifact is the .deb;
      # AppImage is secondary and requires FUSE 2.
      # Packaging runs on master pushes only (see cost note at top).

      - name: Build Electron (Windows)
        if: matrix.os == 'windows-latest' && github.event_name == 'push'
        # No GH_TOKEN needed for non-publishing builds usually, 
        # but required if electron-builder needs to read repo info or if we add code-signing later.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run dist:win

      - name: Build Electron (Linux)
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run dist:linux

      - name: Build Electron (Mac)
        if: matrix.os == 'macos-latest' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run dist:mac

      - name: Assert packaged version agreement
        if: github.event_name == 'push'
        env:
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: node scripts/assert-packaged-version.js

      # No artifact upload: installer distribution happens exclusively
      # through GitHub Release assets (quota-free), which electron-builder
      # publishes directly. CI compiles, tests, builds, and asserts the
      # packaged version without banking anything against the private-repo
      # Actions storage quota.

  # ===========================================================================
  # SonarCloud Analysis (runs once on ubuntu, after build-check passes)
  # ===========================================================================
  sonar-analysis:
    needs: [runner, build-check]
    if: ${{ !cancelled() && needs.build-check.result == 'success' }}
    runs-on: ${{ needs.runner.outputs.hosted == 'true' && 'ubuntu-latest' || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ./desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate blame/coverage

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ needs.runner.outputs.hosted == 'true' && 'npm' || '' }}
          cache-dependency-path: desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
