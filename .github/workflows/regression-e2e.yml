name: Regression E2E (manual only)

# Full-feature regression: real Electron + locally served renderer + transient
# test DB (desktop/e2e/regression/, `npm run e2e:regression` in desktop/).
#
# MANUAL TRIGGER ONLY. This workflow has no push/pull_request/schedule
# triggers by design: it never runs on branches, PRs, or commits. Launch it
# from Actions → "Regression E2E (manual only)" → Run workflow, optionally
# limiting the run to a single spec file.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec suite to run (full suite by default)'
        required: false
        default: 'full suite'
        type: choice
        options:
          - 'full suite'
          - '01 auth + RBAC'
          - '02 navigation'
          - '03 patients'
          - '04 queue + visit'
          - '05 settings + admin'
          - '06 online booking'

jobs:
  # Picks the runner for the jobs below: GitHub-hosted while the account
  # has Actions minutes left, otherwise CI_RUNNER (see feature-ci.yml).
  # Out of minutes, this job fails within seconds without running;
  # continue-on-error keeps that from failing the run.
  runner:
    # Shows as failed on a PR while the account is out of minutes; expected.
    name: GitHub-hosted minutes
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 2
    outputs:
      hosted: ${{ steps.probe.outputs.hosted }}
    steps:
      - id: probe
        run: echo "hosted=true" >> "$GITHUB_OUTPUT"

  regression-e2e:
    needs: runner
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.runner.outputs.hosted == 'true' && 'ubuntu-latest' || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # CI_RUNNER: self-hosted runners keep ~/.npm, so skip the GitHub cache (see feature-ci.yml).
          cache: ${{ needs.runner.outputs.hosted == 'true' && 'npm' || '' }}
          cache-dependency-path: desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Electron system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libgbm1 libasound2t64 libnss3 libxss1 libxtst6 xauth libsecret-1-0 fontconfig

      - name: Warm fontconfig cache
        # First-ever Chromium launch scans all system fonts (can exceed the
        # launch budget on cold runners); warming makes launches deterministic.
        run: fc-cache -f > /dev/null

      - name: Start session keyring
        # Electron safeStorage uses gnome-libsecret (forced by the app) and
        # needs a session bus plus an unlocked login keyring. Verified:
        # without this, device setup fails with ENCRYPTION_UNAVAILABLE.
        run: |
          sudo apt-get install -y gnome-keyring dbus-x11
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
          echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> $GITHUB_ENV
          printf 'nalamdesk-ci' | gnome-keyring-daemon --daemonize --login --components=secrets
          sleep 1
          printf 'nalamdesk-ci' | gnome-keyring-daemon --replace --unlock --components=secrets

      - name: Fix Electron sandbox permissions
        # Chromium's SUID sandbox requires chrome-sandbox to be root-owned
        # with mode 4755; npm extraction loses that. Keeps sandboxing on
        # (preferable to --no-sandbox) for a faithful test environment.
        run: |
          sudo chown root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Preflight Electron startup
        # Boots the real app once (no Playwright) and fails fast with logs
        # if it crashes or never creates a window — instead of timing out
        # 6 spec files at 60s each with zero diagnostics.
        env:
          NODE_ENV: test
          NALAMDESK_E2E_USER_DATA: /tmp/e2e-preflight
          ELECTRON_ENABLE_LOGGING: 1
        run: |
          npm run build:main
          # NB: `|| code=$?` — without it, `set -e` kills the step on
          # timeout's 124 before the diagnostics below can run.
          timeout 25 xvfb-run -a node_modules/.bin/electron dist/main/main.js > /tmp/preflight.log 2>&1 || code=$?
          tail -30 /tmp/preflight.log
          if [ $code -ne 124 ]; then echo "app exited early (code=$code)"; exit 1; fi
          grep -q "BrowserWindow created" /tmp/preflight.log || { echo "no window created within 25s"; exit 1; }

      - name: Run regression suite
        # Headed Electron under a virtual display; the renderer is served
        # locally by the Playwright webServer entry (ng serve) and each
        # spec launches the real app against an isolated nalamdesk-test.db.
        # The spec argument comes from a fixed choice list (never free text),
        # mapped here so workflow input never reaches a shell command line.
        env:
          # Mirror main-process console to stderr so startup hangs are visible.
          ELECTRON_ENABLE_LOGGING: 1
          # Stream Playwright's browser-launch handshake live (Debugger /
          # DevTools listening lines). If electron.launch() stalls, the last
          # printed line shows exactly which handshake stage never arrived.
          DEBUG: 'pw:browser*'
        run: |
          case "${{ inputs.spec }}" in
            '01 auth + RBAC') TARGET='e2e/regression/01-auth-rbac.spec.ts' ;;
            '02 navigation') TARGET='e2e/regression/02-navigation.spec.ts' ;;
            '03 patients') TARGET='e2e/regression/03-patients.spec.ts' ;;
            '04 queue + visit') TARGET='e2e/regression/04-queue-visit.spec.ts' ;;
            '05 settings + admin') TARGET='e2e/regression/05-settings-admin.spec.ts' ;;
            '06 online booking') TARGET='e2e/regression/06-online-booking.spec.ts' ;;
            *) TARGET='e2e/regression' ;;
          esac
          xvfb-run -a -s "-screen 0 1440x900x24" node_modules/.bin/playwright test "$TARGET" --reporter=line,html

      - name: Upload regression report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: desktop/playwright-report

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-traces
          path: desktop/test-results
