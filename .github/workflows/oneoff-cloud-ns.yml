name: One-off cloud NS delegation

# Temporary: delegates cloud.nalamdesk.com to Route 53 by adding NS records
# in the nalamdesk.com Cloudflare zone. Removed right after it runs.
on:
  push:
    branches:
      - claude/project-thread-4rlgms
    paths:
      - '.github/workflows/oneoff-cloud-ns.yml'

permissions:
  contents: read

jobs:
  ns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add NS records for cloud.nalamdesk.com
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api=https://api.cloudflare.com/client/v4
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json")
          zone=$(curl -sS "${auth[@]}" "$api/zones?name=nalamdesk.com" | jq -r '.result[0].id // empty')
          if [ -z "$zone" ]; then
            echo "::error::Token cannot see the nalamdesk.com zone"
            curl -sS "${auth[@]}" "$api/zones?name=nalamdesk.com" | jq '{success, errors}'
            exit 1
          fi
          echo "Existing records named cloud.nalamdesk.com:"
          curl -sS "${auth[@]}" "$api/zones/$zone/dns_records?name=cloud.nalamdesk.com" | jq -c '.result[] | {type, content}'
          existing=$(curl -sS "${auth[@]}" "$api/zones/$zone/dns_records?type=NS&name=cloud.nalamdesk.com" | jq -r '.result[].content')
          fail=0
          for ns in ns-1775.awsdns-29.co.uk ns-570.awsdns-07.net ns-1192.awsdns-21.org ns-60.awsdns-07.com; do
            if grep -qx "$ns" <<<"$existing"; then echo "Already there: $ns"; continue; fi
            body=$(jq -n --arg c "$ns" '{type:"NS", name:"cloud", content:$c, ttl:3600}')
            res=$(curl -sS "${auth[@]}" -X POST "$api/zones/$zone/dns_records" --data "$body")
            if [ "$(jq -r .success <<<"$res")" = "true" ]; then echo "Added: $ns"; else echo "Failed: $ns"; jq '.errors' <<<"$res"; fail=1; fi
          done
          echo "Public answer now:"
          dig +short NS cloud.nalamdesk.com @1.1.1.1 || true
          exit $fail
