version: 1
# Floor for the action release; the workflow `uses:` ref selects it.
requires_action: ">=0.17.0"

defaults:
  on: [opened, synchronize, ready_for_review]
  command: "/review"
  draft: false
  lang: en
  ignore: ["**.lock", "dist/**", "*.snap", "package-lock.json", "desktop/dist/**"]
  max_diff_chars: 80000

providers:
  # Single reviewer: minimax-m3.1-flash-free on the OpenCode Go subscription
  # key. space-bunny-free was MiniMax's stealth name for this same model;
  # OpenCode retired that ID when MiniMax M3.1 Flash launched (2026-10-19)
  # and lists it as minimax-m3.1-flash-free (free, limited time, no Go quota,
  # no training, 0-day retention). Same model, so the measured reasoning cap
  # below still applies. Fallback if it goes away: cat-jam-free, which
  # openreview reviews itself with. Avoid longcat-2.5-preview-free: it answers
  # prose instead of the JSON contract on real diffs.
  # Proven on openreview's own repo: reasoning models spend thinking from the
  # 2000-token output budget, and on an uncapped run both agents burned the
  # whole budget and bailed to {"findings":[]} on every PR. Capping the think
  # fixes it (same 80k-char diff: 0/5 parseable uncapped, 2/2 with real
  # findings capped). glm-5.3-flash removed outright — heavier thinker, same
  # failure, no reason to pay for it here.
  opencode:
    protocol: openai-chat
    model: minimax-m3.1-flash-free
    base_url: https://opencode.ai/zen/go/v1
    key_from: secrets.OPENCODE_API_KEY
    # Stays active (measured, do not remove): without it the think eats the
    # answer (empty content, finish_reason=length). json_mode stays at its
    # default true for the same reason — the JSON contract needs both.
    extra_body: { reasoning_effort: "low" }

reviews:
  - id: correctness
    if_paths: ["**"]
    strategy: majority
    profile: balanced # noise preset (v0.11); explicit max_findings below wins
    max_findings: 5 # mechanical cap matching the "at most 5" prompt instruction
    main:
      provider: opencode
      instructions: >-
        Synthesize sub-agent findings for the NalamDesk clinic desktop app
        (Electron + Angular + SQLite). Report at most 5 findings, P1/P2 only,
        high confidence: real bugs, security holes, or data-loss risks.
        Skip style, nits, hypotheticals, and anything already obviously
        handled. Deduplicate overlapping findings. Format contract (the
        consumer parses severity separately, so the tag must be literal
        text): begin EVERY finding comment with exactly "[P1] " or "[P2] "
        as its first four characters, and set the severity field to "high"
        for both. [P1] Critical (correctness, security, data-loss, or
        access-control defect — must fix before merge), [P2] High
        (significant bug, likely-wrong behavior, missing coverage on risky
        paths — should fix). Never emit P3/P4 or untagged findings.
    subagents:
      - name: minimax-check
        provider: opencode
        instructions: >-
          Independent correctness pass: real bugs, race conditions, null
          handling, broken error paths. At most 5 findings, high confidence
          only, no nits. Begin every finding comment with "[P1] " or "[P2] "
          and set severity field to "high".
    verdict:
      mode: comment
      min_severity: high
      post_inline: true
      deduplicate: true

  - id: security
    if_paths: ["desktop/src/main/**", "desktop/src/server/**", "desktop/src/shared/access.ts", "desktop/src/**/auth*", "desktop/src/**/settings/**"]
    strategy: any
    profile: balanced # noise preset (v0.11); explicit max_findings below wins
    max_findings: 5 # mechanical cap matching the "at most 5" prompt instruction
    main:
      provider: opencode
      instructions: >-
        Staff security reviewer for a clinic app guarding patient data.
        Focus: Cedar/RBAC default-deny, admin-only destructive actions,
        auth/session handling, SQL injection, secret leakage, overly broad
        permissions, insecure IPC exposure. At most 5 findings, high
        confidence only — no hypotheticals, no style. Tag every finding
        [P1] (critical, must fix) or [P2] (high, should fix) — never P3/P4.
        Begin every finding comment with "[P1] " or "[P2] " as its first
        four characters with severity field "high".
    subagents:
      - name: secrets-scan
        provider: opencode
        instructions: >-
          Find leaked secrets, hardcoded credentials, keys in logs or
          comments, overly broad file/IPC permissions. At most 5 findings,
          high confidence only. Begin every finding comment with "[P1] " or
          "[P2] " with severity field "high".
    verdict:
      mode: comment
      min_severity: high
      post_inline: true
      deduplicate: true

global_verdict:
  strategy: any_blocking
  sticky_comment: true
  fail_check_on_request_changes: false
