name: Automated Release

on:
  workflow_dispatch:

concurrency:
  group: automated-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Picks the runner for the jobs below: GitHub-hosted while the account
  # has Actions minutes left, otherwise CI_RUNNER (see feature-ci.yml).
  # Out of minutes, this job fails within seconds without running;
  # continue-on-error keeps that from failing the run.
  runner:
    # Shows as failed on a PR while the account is out of minutes; expected.
    name: GitHub-hosted minutes
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 2
    outputs:
      hosted: ${{ steps.probe.outputs.hosted }}
    steps:
      - id: probe
        run: echo "hosted=true" >> "$GITHUB_OUTPUT"

  bump-version:
    needs: runner
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.runner.outputs.hosted == 'true' && 'ubuntu-latest' || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump Version & Push Tag
        id: bump
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./desktop/package.json').version")
          
          # Increment patch version (simple semantic logic)
          cd desktop
          npm version patch --no-git-tag-version
          cd ..
          
          NEW_VERSION=$(node -p "require('./desktop/package.json').version")
          NEW_TAG="v$NEW_VERSION"
          
          echo "Bumping from $CURRENT_VERSION to $NEW_VERSION"
          
          # Update package.json, commit, and tag
          git add desktop/package.json
          git commit -m "chore(release): bump version to $NEW_VERSION [skip ci]"
          git tag $NEW_TAG
          
          # Push changes
          git push origin master
          git push origin $NEW_TAG
          
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

  build-and-release:
    needs: [runner, bump-version]
    if: ${{ !cancelled() && needs.bump-version.result == 'success' }}
    # matrix.os stays the logical OS name; only the ubuntu leg can move to
    # CI_RUNNER. Windows and macOS always need GitHub-hosted runners.
    runs-on: ${{ matrix.os != 'ubuntu-latest' && matrix.os || needs.runner.outputs.hosted == 'true' && 'ubuntu-latest' || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ./desktop
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # CI_RUNNER: self-hosted runners keep ~/.npm, so skip the GitHub cache (see feature-ci.yml).
          cache: ${{ needs.runner.outputs.hosted == 'true' && 'npm' || '' }}
          cache-dependency-path: desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular
        env:
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      # Build & Publish based on OS. The code repo is private, so installers and
      # latest*.yml go to the public sankara-sabapathy/nalamdesk-releases repo
      # (desktop/package.json "publish"). RELEASES_TOKEN is a fine-grained token
      # with Contents read/write on that repo only; GITHUB_TOKEN cannot write there.
      - name: Build & Publish Electron (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run dist:win -- --publish always

      - name: Build & Publish Electron (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run dist:linux -- --publish always

      - name: Build & Publish Electron (Mac)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run dist:mac -- --publish always
