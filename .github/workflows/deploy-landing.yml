name: Deploy Landing

# nalamdesk.com homepage (landing/) via Cloudflare Workers Static Assets.
# NOTE: `cf deploy` (cf beta) cannot consume the Astro adapter's build
# output yet (it demands .cloudflare/output/v0/config.json), so this
# pipeline builds with Astro and deploys with Wrangler, which the adapter
# emits config for (wrangler.jsonc, worker `nalamdesk-landing`).
# Re-evaluate `cf deploy` when cf leaves beta.
on:
  pull_request:
    branches:
      - master
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'
  push:
    branches:
      - master
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'

jobs:
  # Picks the runner for the jobs below: GitHub-hosted while the account
  # has Actions minutes left, otherwise CI_RUNNER (see feature-ci.yml).
  # Out of minutes, this job fails within seconds without running;
  # continue-on-error keeps that from failing the run.
  runner:
    # Shows as failed on a PR while the account is out of minutes; expected.
    name: GitHub-hosted minutes
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 2
    outputs:
      hosted: ${{ steps.probe.outputs.hosted }}
    steps:
      - id: probe
        run: echo "hosted=true" >> "$GITHUB_OUTPUT"

  landing:
    needs: runner
    if: ${{ !cancelled() }}
    name: Build, dry-run, deploy
    runs-on: ${{ needs.runner.outputs.hosted == 'true' && 'ubuntu-latest' || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ./landing
    env:
      CF_SEND_TELEMETRY: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # CI_RUNNER: self-hosted runners keep ~/.npm, so skip the GitHub cache (see feature-ci.yml).
          cache: ${{ needs.runner.outputs.hosted == 'true' && 'npm' || '' }}
          cache-dependency-path: landing/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate Worker config (no credentials)
        run: npx wrangler deploy --dry-run

      - name: Deploy to Cloudflare
        if: github.event_name == 'push'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
