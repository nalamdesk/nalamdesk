name: Pages CI

# Validates the docs site on PRs (Docusaurus). On master, deploy-docs.yml
# builds the same site before deploying it to Cloudflare, so no push run
# here. Landing has its own pipeline in deploy-landing.yml (build +
# wrangler dry-run on PR, deploy on master).
on:
  pull_request:
    branches:
      - master
    paths:
      - 'cloud/documentation/**'
      - '.github/workflows/pages-ci.yml'

jobs:
  docs:
    name: Docs build (Docusaurus)
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ./cloud/documentation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # CI_RUNNER: self-hosted runners keep ~/.npm, so skip the GitHub cache (see feature-ci.yml).
          cache: ${{ !vars.CI_RUNNER && 'npm' || '' }}
          cache-dependency-path: cloud/documentation/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build
