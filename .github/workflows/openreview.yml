name: OpenReview

# AI code review (advisory only): runs on PR open and every push, plus
# `/review` comments. Verdicts are comment-mode and never fail CI — the
# human-enforced P1 rule in the merge workflow stays authoritative.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: read

# Full re-review on every push until upstream incremental mode lands
# (openreview#18) — cancel superseded runs to avoid burning provider budget.
# Event name is part of the key: bot comments fire issue_comment runs in the
# same PR, and without it they'd cancel the real pull_request review.
concurrency:
  group: openreview-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Picks the runner for the jobs below: GitHub-hosted while the account
  # has Actions minutes left, otherwise CI_RUNNER (see feature-ci.yml).
  # Out of minutes, this job fails within seconds without running;
  # continue-on-error keeps that from failing the run.
  runner:
    # Shows as failed on a PR while the account is out of minutes; expected.
    name: GitHub-hosted minutes
    # Only when the review below would run, so bot comments cost no minutes.
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.issue.pull_request &&
       github.event.comment.body == '/review' &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 2
    outputs:
      hosted: ${{ steps.probe.outputs.hosted }}
    steps:
      - id: probe
        run: echo "hosted=true" >> "$GITHUB_OUTPUT"

  review:
    needs: runner
    # Same-repo PRs only (no fork code near secrets), and /review restricted
    # to maintainers by exact match: substring triggers + open triggers let
    # any commenter spend provider budget and reach for secrets.
    if: >
      !cancelled() && (
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event.issue.pull_request &&
         github.event.comment.body == '/review' &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ${{ needs.runner.outputs.hosted == 'true' && 'ubuntu-latest' || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: sankara-sabapathy/openreview@v1 # tracks latest release (moved per release; see openreview AGENTS.md invariant 4)
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
