name: Server Packages

# NalamDesk Server packages (ADR 0001, #197): the Linux .deb and tarball,
# the Docker image and the Windows service zip, each smoke-tested by moving a
# desktop backup onto it and signing in.
#
# - PRs: Linux packages and the Docker image, on amd64 and arm64 (nothing published).
# - master pushes: also the Windows zip, with a real service install.
# - Releases: build.yml calls this with a tag; packages are uploaded to the
#   nalamdesk/releases draft and the image is pushed to GHCR as one
#   multi-arch tag.
#
# Third-party actions are pinned to a commit; the comment names its tag.
on:
  pull_request:
    branches:
      - master
    paths:
      - 'desktop/**'
      - '.github/workflows/server-package.yml'
      - '!**.md'
  push:
    branches:
      - master
    paths:
      - 'desktop/**'
      - '.github/workflows/server-package.yml'
  workflow_call:
    inputs:
      tag:
        description: Release tag to check out and publish (vX.Y.Z).
        type: string
        required: true
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true

concurrency:
  group: server-package-${{ inputs.tag || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/nalamdesk/nalamdesk-server
  # The NalamDesk Cloud relay the packages pair with (docs/architecture/cloud-relay.md).
  # build:web stamps it into build-identity.json; empty means pairing is off.
  NALAMDESK_RELAY_URL: ${{ vars.NALAMDESK_RELAY_URL }}
  # WinSW 2.12.0 (https://github.com/winsw/winsw), pinned by checksum.
  WINSW_URL: https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe
  WINSW_SHA256: 05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da

jobs:
  # Each architecture builds on its own runner, so the native modules and the
  # bundled Node match the package. The amd64 leg keeps the plain job name.
  linux:
    name: ${{ matrix.arch == 'amd64' && 'linux' || format('linux-{0}', matrix.arch) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: ./desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Electron's install hooks are not needed for the server.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
          npm rebuild better-sqlite3-multiple-ciphers argon2

      - name: Build server and web UI
        env:
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: |
          npm run build:server
          npm run build:web

      - name: Package .deb and tarball
        run: |
          node scripts/package-server.js deb --out release/server
          node scripts/package-server.js tar --out release/server
          ls -la release/server

      - name: Smoke test the .deb in a clean Debian
        run: |
          node packaging/server/smoke/make-desktop-backup.js dist/server "$RUNNER_TEMP/work"
          chmod 0644 "$RUNNER_TEMP"/work/*
          docker run --rm \
            -v "$PWD/release/server:/pkg:ro" -v "$RUNNER_TEMP/work:/work:ro" \
            -v "$PWD/packaging/server/smoke:/smoke:ro" \
            debian:bookworm-slim sh /smoke/deb-smoke.sh

      - name: Release bot token
        if: inputs.tag != ''
        id: bot
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: nalamdesk
          repositories: releases

      - name: Upload to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" --repo nalamdesk/releases --clobber \
            release/server/nalamdesk-server_*.deb release/server/nalamdesk-server-*-linux-*.tar.gz

  docker:
    name: ${{ matrix.arch == 'amd64' && 'docker' || format('docker-{0}', matrix.arch) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ./desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || '' }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: desktop
          file: desktop/packaging/server/Dockerfile
          load: true
          tags: nalamdesk-server:test
          build-args: |
            VERSION=${{ inputs.tag || github.sha }}
            NALAMDESK_BUILD_COMMIT=${{ github.sha }}
            NALAMDESK_RELAY_URL=${{ vars.NALAMDESK_RELAY_URL }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Smoke test the image (init, then import into a second volume)
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
          npm rebuild better-sqlite3-multiple-ciphers argon2
          npm run build:server
          work="$RUNNER_TEMP/work"
          node packaging/server/smoke/make-desktop-backup.js dist/server "$work"
          printf 'a-strong-admin-password\n' > "$work/admin-password"
          chmod 0644 "$work"/*

          docker run --rm -v nd-init:/var/lib/nalamdesk -v "$work:/run/secrets:ro" \
            -e NALAMDESK_ADMIN_PASSWORD_FILE=/run/secrets/admin-password \
            nalamdesk-server:test init --clinic-name "CI Clinic"
          docker run -d --name nd-init -p 3101:3000 -v nd-init:/var/lib/nalamdesk nalamdesk-server:test
          node packaging/server/smoke/login.js wait https://127.0.0.1:3101 || { docker logs nd-init; exit 1; }
          code=""
          for _ in $(seq 1 10); do
            code="$(docker exec nd-init nalamdesk-server join-code --name CI 2>/dev/null | grep -oE '[0-9A-Z]{5}(-[0-9A-Z]{5}){3}' | head -n 1 || true)"
            [ -n "$code" ] && break
            sleep 1
          done
          docker cp nd-init:/var/lib/nalamdesk/tls/server.crt "$work/nd-init.crt"
          NODE_EXTRA_CA_CERTS="$work/nd-init.crt" node packaging/server/smoke/login.js https://127.0.0.1:3101 admin "$work/admin-password" "$code" \
            || { docker logs nd-init; exit 1; }

          docker run --rm -v nd-import:/var/lib/nalamdesk -v "$work:/run/secrets:ro" \
            -e NALAMDESK_RECOVERY_CODE_FILE=/run/secrets/code \
            nalamdesk-server:test import /run/secrets/clinic.ndbackup
          docker run -d --name nd-import -p 3102:3000 -v nd-import:/var/lib/nalamdesk nalamdesk-server:test
          node packaging/server/smoke/login.js wait https://127.0.0.1:3102 || { docker logs nd-import; exit 1; }
          code=""
          for _ in $(seq 1 10); do
            code="$(docker exec nd-import nalamdesk-server join-code --name CI 2>/dev/null | grep -oE '[0-9A-Z]{5}(-[0-9A-Z]{5}){3}' | head -n 1 || true)"
            [ -n "$code" ] && break
            sleep 1
          done
          docker cp nd-import:/var/lib/nalamdesk/tls/server.crt "$work/nd-import.crt"
          NODE_EXTRA_CA_CERTS="$work/nd-import.crt" node packaging/server/smoke/login.js https://127.0.0.1:3102 admin "$work/desktop-password" "$code" \
            || { docker logs nd-import; exit 1; }

          # A clean stop closes the database within the grace period.
          docker stop -t 30 nd-init nd-import
          test "$(docker inspect -f '{{.State.ExitCode}}' nd-init)" = "0"

      # The documented install: compose.yaml with init, then up.
      - name: Smoke test compose.yaml
        env:
          NALAMDESK_VERSION: ci
          NALAMDESK_PORT: '3103'
          COMPOSE_PROJECT_NAME: ndcompose
        run: |
          docker tag nalamdesk-server:test ghcr.io/nalamdesk/nalamdesk-server:ci
          compose="docker compose -f packaging/server/compose.yaml"
          $compose config -q
          $compose run --rm -T -e NALAMDESK_ADMIN_PASSWORD=a-strong-admin-password \
            nalamdesk init --clinic-name "CI Clinic"
          $compose up -d --pull never
          node packaging/server/smoke/login.js wait https://127.0.0.1:3103 || { $compose logs; exit 1; }
          $compose exec -T nalamdesk nalamdesk-server status
          $compose down

      - name: Log in to GHCR
        if: inputs.tag != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One tag per architecture here; docker-manifest joins them.
      - name: Push image
        if: inputs.tag != ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: desktop
          file: desktop/packaging/server/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ inputs.tag }}
            NALAMDESK_BUILD_COMMIT=${{ github.sha }}
            NALAMDESK_RELAY_URL=${{ vars.NALAMDESK_RELAY_URL }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}

  docker-manifest:
    if: inputs.tag != ''
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the multi-arch tags
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$RELEASE_TAG" -t "$IMAGE:latest" \
            "$IMAGE:$RELEASE_TAG-amd64" "$IMAGE:$RELEASE_TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG"

  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
          npm rebuild better-sqlite3-multiple-ciphers argon2

      - name: Build server and web UI
        env:
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: |
          npm run build:server
          npm run build:web

      - name: Fetch WinSW
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'WinSW-x64.exe'
          Invoke-WebRequest -Uri $env:WINSW_URL -OutFile $exe
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          if ($hash -ne $env:WINSW_SHA256) { throw "WinSW checksum mismatch: $hash" }
          "WINSW_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package the Windows zip
        run: node scripts/package-server.js win-zip --out release/server

      - name: Smoke test the service install
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'work'
          node packaging/server/smoke/make-desktop-backup.js dist/server $work
          $zip = Get-ChildItem release/server/nalamdesk-server-*-windows-*.zip | Select-Object -First 1
          $extract = Join-Path $env:RUNNER_TEMP 'extract'
          Expand-Archive -Path $zip.FullName -DestinationPath $extract
          & powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $extract 'nalamdesk-server\service\install-service.ps1') -NoFirewall
          if ($LASTEXITCODE -ne 0) { throw 'install-service.ps1 failed' }

          $cli = Join-Path $env:ProgramFiles 'NalamDesk Server\bin\nalamdesk-server.cmd'
          $env:NALAMDESK_RECOVERY_CODE_FILE = Join-Path $work 'code'
          & $cli import (Join-Path $work 'clinic.ndbackup')
          if ($LASTEXITCODE -ne 0) { throw 'import failed' }
          Remove-Item Env:NALAMDESK_RECOVERY_CODE_FILE

          Start-Service NalamDeskServer
          node packaging/server/smoke/login.js wait https://127.0.0.1:3000
          $ok = $LASTEXITCODE -eq 0
          if ($ok) {
            $code = ''
            for ($i = 0; $i -lt 10 -and -not $code; $i++) {
              $joinOutput = (& $cli join-code --name CI 2>$null) -join "`n"
              $code = [regex]::Match($joinOutput, '[0-9A-Z]{5}(-[0-9A-Z]{5}){3}').Value
              if (-not $code) { Start-Sleep -Seconds 1 }
            }
            $env:NODE_EXTRA_CA_CERTS = Join-Path $env:ProgramData 'NalamDesk\server\tls\server.crt'
            node packaging/server/smoke/login.js https://127.0.0.1:3000 admin (Join-Path $work 'desktop-password') $code
            $ok = $LASTEXITCODE -eq 0
          }
          if (-not $ok) { Get-Content "$env:ProgramData\NalamDesk\server\logs\*" -ErrorAction SilentlyContinue }
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:ProgramFiles\NalamDesk Server\service\uninstall-service.ps1"
          if (-not $ok) { throw 'The service did not serve the imported clinic.' }

      - name: Release bot token
        if: inputs.tag != ''
        id: bot
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: nalamdesk
          repositories: releases

      - name: Upload to the release
        if: inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $zip = Get-ChildItem release/server/nalamdesk-server-*-windows-*.zip | Select-Object -First 1
          gh release upload $env:RELEASE_TAG --repo nalamdesk/releases --clobber $zip.FullName
