name: Automated Release

on:
  workflow_dispatch:

concurrency:
  group: automated-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Picks the runner for the jobs below: GitHub-hosted while the account
  # has Actions minutes left, otherwise CI_RUNNER (see feature-ci.yml).
  # Out of minutes, this job fails within seconds without running;
  # continue-on-error keeps that from failing the run.
  runner:
    # Shows as failed on a PR while the account is out of minutes; expected.
    name: GitHub-hosted minutes
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 2
    outputs:
      hosted: ${{ steps.probe.outputs.hosted }}
    steps:
      - id: probe
        run: echo "hosted=true" >> "$GITHUB_OUTPUT"

  bump-version:
    needs: runner
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.runner.outputs.hosted == 'true' && 'ubuntu-latest' || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump Version & Push Tag
        id: bump
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./desktop/package.json').version")
          
          # Increment patch version (simple semantic logic)
          cd desktop
          npm version patch --no-git-tag-version
          cd ..
          
          NEW_VERSION=$(node -p "require('./desktop/package.json').version")
          NEW_TAG="v$NEW_VERSION"
          
          echo "Bumping from $CURRENT_VERSION to $NEW_VERSION"
          
          # Update package.json, commit, and tag
          git add desktop/package.json
          git commit -m "chore(release): bump version to $NEW_VERSION [skip ci]"
          git tag $NEW_TAG
          
          # Push changes
          git push origin master
          git push origin $NEW_TAG
          
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      # One draft release up front, so the per-OS legs below upload into it
      # instead of racing to create it. publish-release makes it live once
      # every leg has uploaded, so clinics never see a half-filled release.
      - name: Create draft release in nalamdesk-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          node -e '
            const tag = process.env.NEW_TAG;
            fetch("https://api.github.com/repos/sankara-sabapathy/nalamdesk-releases/releases", {
              method: "POST",
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" },
              body: JSON.stringify({ tag_name: tag, name: tag, draft: true })
            }).then(async (res) => {
              if (!res.ok) { console.error(res.status, await res.text()); process.exit(1); }
              console.log(`Draft release ${tag} created`);
            });
          '

  build-and-release:
    needs: [runner, bump-version]
    if: ${{ !cancelled() && needs.bump-version.result == 'success' }}
    # matrix.os stays the logical OS name. Out of GitHub-hosted minutes, the
    # ubuntu leg moves to CI_RUNNER and the windows leg to CI_RUNNER_WINDOWS
    # (a self-hosted Windows runner, e.g. ["self-hosted","Windows"]), and
    # the macOS leg is dropped: it needs GitHub-hosted runners, and macOS
    # downloads stay "coming soon" until the build is signed.
    runs-on: >-
      ${{ matrix.os == 'macos-latest' && 'macos-latest'
      || needs.runner.outputs.hosted == 'true' && matrix.os
      || matrix.os == 'windows-latest' && (vars.CI_RUNNER_WINDOWS && fromJSON(vars.CI_RUNNER_WINDOWS) || 'windows-latest')
      || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ./desktop
    strategy:
      # One OS failing must not cancel the others mid-upload.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.runner.outputs.hosted == 'true' && '["windows-latest","ubuntu-latest","macos-latest"]' || '["windows-latest","ubuntu-latest"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # CI_RUNNER: self-hosted runners keep ~/.npm, so skip the GitHub cache (see feature-ci.yml).
          cache: ${{ needs.runner.outputs.hosted == 'true' && 'npm' || '' }}
          cache-dependency-path: desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular
        env:
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      # Build & Publish based on OS. The code repo is private, so installers and
      # latest*.yml go to the public sankara-sabapathy/nalamdesk-releases repo
      # (desktop/package.json "publish"). RELEASES_TOKEN is a fine-grained token
      # with Contents read/write on that repo only; GITHUB_TOKEN cannot write there.
      - name: Build & Publish Electron (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run dist:win -- --publish always

      - name: Build & Publish Electron (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run dist:linux -- --publish always

      - name: Build & Publish Electron (Mac)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run dist:mac -- --publish always

  publish-release:
    needs: [runner, bump-version, build-and-release]
    if: ${{ !cancelled() && needs.build-and-release.result == 'success' }}
    runs-on: ${{ needs.runner.outputs.hosted == 'true' && 'ubuntu-latest' || vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NEW_TAG: ${{ needs.bump-version.outputs.new_tag }}
        run: |
          node -e '
            const api = "https://api.github.com/repos/sankara-sabapathy/nalamdesk-releases/releases";
            const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" };
            (async () => {
              const releases = await (await fetch(`${api}?per_page=20`, { headers })).json();
              const draft = releases.find((r) => r.tag_name === process.env.NEW_TAG && r.draft);
              if (!draft) { console.error(`No draft release for ${process.env.NEW_TAG}`); process.exit(1); }
              const res = await fetch(`${api}/${draft.id}`, {
                method: "PATCH", headers, body: JSON.stringify({ draft: false, make_latest: "true" })
              });
              if (!res.ok) { console.error(res.status, await res.text()); process.exit(1); }
              console.log(`Published ${process.env.NEW_TAG}`);
            })();
          '
