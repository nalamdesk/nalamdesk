name: Pages CI

# Validates the docs site on PRs (Docusaurus, deployed to GitHub Pages
# by deploy-docs.yml on master). Landing has its own pipeline in
# deploy-landing.yml (build + wrangler dry-run on PR, deploy on master).
on:
  pull_request:
    branches:
      - master
    paths:
      - 'cloud/documentation/**'
      - '.github/workflows/pages-ci.yml'
  push:
    branches:
      - master
    paths:
      - 'cloud/documentation/**'

jobs:
  docs:
    name: Docs build (Docusaurus)
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ./cloud/documentation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: cloud/documentation/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build
