name: Feature Branch CI

# PRs targeting master still run Feature CI. Also run on push to master so
# squash-merges produce Electron artifacts. Restricting push to master avoids
# duplicate runs on feature-branch commits (those already fire via pull_request).
# Automated Release stays workflow_dispatch-only and is not used here.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-check:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./desktop
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular
        env:
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Run Unit Tests
        run: npm test -- --run


      # Build Electron (no publish). Linux clinic artifact is the .deb;
      # AppImage is secondary and requires FUSE 2.
      
      - name: Build Electron (Windows)
        if: matrix.os == 'windows-latest'
        # No GH_TOKEN needed for non-publishing builds usually, 
        # but required if electron-builder needs to read repo info or if we add code-signing later.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run dist:win

      - name: Build Electron (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run dist:linux

      - name: Build Electron (Mac)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run dist:mac

      - name: Assert packaged version agreement
        env:
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: node scripts/assert-packaged-version.js

      # Upload Artifacts to Action Run (master only: PR runs still compile
      # and assert, but must not bank 300MB installers per push against
      # the private-repo storage quota).
      - name: Upload Artifacts
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: nalamdesk-${{ matrix.os }}
          path: |
            desktop/release/*.deb
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/LINUX-INSTALL.txt
            desktop/release/run-nalamdesk-appimage.sh
            desktop/release/APPIMAGE-FUSE.txt
          retention-days: 5

  # ===========================================================================
  # SonarCloud Analysis (runs once on ubuntu, after build-check passes)
  # ===========================================================================
  sonar-analysis:
    needs: build-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate blame/coverage

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
