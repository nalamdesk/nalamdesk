name: Automated Release

on:
  workflow_dispatch:

concurrency:
  group: automated-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump-version:
    if: ${{ true }}
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump Version & Push Tag
        id: bump
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./desktop/package.json').version")
          
          # Increment patch version (simple semantic logic)
          cd desktop
          npm version patch --no-git-tag-version
          cd ..
          
          NEW_VERSION=$(node -p "require('./desktop/package.json').version")
          NEW_TAG="v$NEW_VERSION"
          
          echo "Bumping from $CURRENT_VERSION to $NEW_VERSION"
          
          # Update package.json, commit, and tag
          git add desktop/package.json
          git commit -m "chore(release): bump version to $NEW_VERSION [skip ci]"
          git tag $NEW_TAG
          
          # Push changes
          git push origin master
          git push origin $NEW_TAG
          
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      # Releases are written by the nalamdesk-release-bot GitHub App, so the
      # public repo names no person. The token is scoped to nalamdesk/releases.
      - name: Release bot token
        id: bot
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: nalamdesk
          repositories: releases

      # One draft release up front, so the per-OS legs below upload into it
      # instead of racing to create it. publish-release makes it live once
      # every leg has uploaded, so clinics never see a half-filled release.
      # A release needs a commit to tag, so the bot seeds an empty repo
      # with a README first.
      - name: Create draft release in nalamdesk/releases
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          node -e '
            const api = "https://api.github.com/repos/nalamdesk/releases";
            const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" };
            const tag = process.env.NEW_TAG;
            const ok = async (res) => { if (!res.ok) { console.error(res.status, await res.text()); process.exit(1); } return res; };
            (async () => {
              const commits = await fetch(`${api}/commits?per_page=1`, { headers });
              if (commits.status === 409) {
                const readme = "# NalamDesk releases\n\nDesktop installers and the in-app update feed. Download from https://nalamdesk.com.\n";
                await ok(await fetch(`${api}/contents/README.md`, {
                  method: "PUT", headers,
                  body: JSON.stringify({ message: "Add README", content: Buffer.from(readme).toString("base64") })
                }));
                console.log("Seeded the releases repo");
              }
              await ok(await fetch(`${api}/releases`, {
                method: "POST", headers,
                body: JSON.stringify({ tag_name: tag, name: tag, draft: true })
              }));
              console.log(`Draft release ${tag} created`);
            })();
          '

  build-and-release:
    needs: [bump-version]
    if: ${{ needs.bump-version.result == 'success' }}
    # matrix.os is the runner. macOS downloads stay "coming soon" until the
    # build is signed.
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./desktop
    strategy:
      # One OS failing must not cancel the others mid-upload.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular
        env:
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Release bot token
        id: bot
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: nalamdesk
          repositories: releases

      # Build & Publish based on OS. Installers and
      # latest*.yml go to the public nalamdesk/releases repo (desktop/package.json
      # "publish"), uploaded by the release bot; GITHUB_TOKEN cannot write there.
      - name: Build & Publish Electron (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run dist:win -- --publish always

      - name: Build & Publish Electron (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run dist:linux -- --publish always

      - name: Build & Publish Electron (Mac)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NALAMDESK_BUILD_COMMIT: ${{ github.sha }}
        run: npm run dist:mac -- --publish always

  publish-release:
    needs: [bump-version, build-and-release]
    if: ${{ needs.build-and-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release bot token
        id: bot
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: nalamdesk
          repositories: releases

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NEW_TAG: ${{ needs.bump-version.outputs.new_tag }}
        run: |
          node -e '
            const api = "https://api.github.com/repos/nalamdesk/releases/releases";
            const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" };
            (async () => {
              const releases = await (await fetch(`${api}?per_page=20`, { headers })).json();
              const draft = releases.find((r) => r.tag_name === process.env.NEW_TAG && r.draft);
              if (!draft) { console.error(`No draft release for ${process.env.NEW_TAG}`); process.exit(1); }
              const res = await fetch(`${api}/${draft.id}`, {
                method: "PATCH", headers, body: JSON.stringify({ draft: false, make_latest: "true" })
              });
              if (!res.ok) { console.error(res.status, await res.text()); process.exit(1); }
              console.log(`Published ${process.env.NEW_TAG}`);
            })();
          '
